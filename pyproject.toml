[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skanetrafiken-cli"
version = "0.0.0"
description = "A command-line journey planner for Skånetrafiken"
requires-python = ">=3.14,<3.15"
dependencies = ["pydantic>=2.12,<3"]

[project.scripts]
skt = "skt.cli:main"

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.14", "ty>=0.0.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/skt"]

[tool.ruff]
line-length = 100

[tool.uv]
exclude-newer = "12 hours"
