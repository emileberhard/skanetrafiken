[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[project]
name = "skane"
version = "0.0.0"
description = "A Python library and CLI for Skånetrafiken journey planning"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12,<3", "tzdata>=2025.1"]

[project.urls]
Homepage = "https://github.com/emileberhard/skanetrafiken"
Repository = "https://github.com/emileberhard/skanetrafiken"
Issues = "https://github.com/emileberhard/skanetrafiken/issues"

[project.scripts]
skane = "skane.cli:main"

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.14", "ty>=0.0.1"]

[tool.ruff]
line-length = 100

[tool.uv]
exclude-newer = "12 hours"
